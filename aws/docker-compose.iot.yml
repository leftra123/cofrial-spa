# EC2 IoT DEDICADA: solo los contenedores del simulador, que insertan telemetría en RDS cada INTERVALO_SEG segundos.
# La flota de 50 camiones se reparte en 5 contenedores de 10 camiones cada uno.
# Uso desde la raíz del repositorio:  docker compose -f aws/docker-compose.iot.yml --env-file .env up -d --build
# Los camiones deben existir en la base: los crea `cargar_demo` al arrancar la EC2 web (CAM-01 a CAM-50).
x-flota: &flota
  build: ../iot
  restart: unless-stopped
x-bd: &bd
  DB_HOST: ${DB_HOST:?define DB_HOST (endpoint de RDS) en .env}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-cofrial}
  DB_USER: ${DB_USER:-cofrial}
  DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  INTERVALO_SEG: ${INTERVALO_SEG:-5}
  PROB_RUPTURA: ${PROB_RUPTURA:-0.001}
  NUM_CAMIONES: "10"
  VELOCIDAD_MEDIA_KMH: ${VELOCIDAD_MEDIA_KMH:-50}     # la web usa la misma para la hora de llegada
  FACTOR_CALLES: ${FACTOR_CALLES:-1.3}
  CONFIRMACION_AUTO_SEG: ${CONFIRMACION_AUTO_SEG:-120}     # plazo del cliente en la puerta; la web usa el mismo

services:
  flota-1: {<<: *flota, environment: {<<: *bd, PRIMER_CAMION: "1"}}
  flota-2: {<<: *flota, environment: {<<: *bd, PRIMER_CAMION: "11"}}
  flota-3: {<<: *flota, environment: {<<: *bd, PRIMER_CAMION: "21"}}
  flota-4: {<<: *flota, environment: {<<: *bd, PRIMER_CAMION: "31"}}
  flota-5: {<<: *flota, environment: {<<: *bd, PRIMER_CAMION: "41"}}
