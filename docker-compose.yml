# Entorno local completo (base, web y la flota de 50 camiones simulados) para desarrollar y probar antes de subir a AWS.
# En AWS se separa: web en una EC2, simulador en otra y la base en RDS (ver docs/decisiones.md).
x-bd: &bd
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-cofrial}
  DB_USER: ${DB_USER:-cofrial}
  DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cofrial}
      POSTGRES_USER: ${DB_USER:-cofrial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    ports: ["127.0.0.1:${DB_PUERTO:-5433}:5432"]  # solo desde esta máquina; 5433 para no chocar con un Postgres local
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cofrial} -d ${DB_NAME:-cofrial}"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    command: sh -c "python manage.py migrate --noinput && python manage.py cargar_demo && python manage.py preparar_bi && gunicorn cofrial.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 8"
    environment:
      <<: *bd
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}            # ruta propia del panel de administración; por defecto /admin/
      ACCESO_MAX_FALLOS_CUENTA: ${ACCESO_MAX_FALLOS_CUENTA:-10}   # claves malas por cuenta antes de bloquearla 15 min
      ACCESO_MAX_FALLOS_IP: ${ACCESO_MAX_FALLOS_IP:-0}           # 0 = sin límite por IP (en la defensa toda la sala sale por una IP)
      ESCANEO_MAX_404: ${ESCANEO_MAX_404:-60}                    # «no encontrado» por IP en la ventana antes del 429
      ESCANEO_VENTANA_SEG: ${ESCANEO_VENTANA_SEG:-600}
      LIMITE_REGISTRO_HORA: ${LIMITE_REGISTRO_HORA:-10}          # registros por IP y hora
      LIMITE_SOPORTE_HORA: ${LIMITE_SOPORTE_HORA:-20}            # consultas a soporte (gastan cuota de IA) por IP y hora
      LIMITE_RECUPERAR_HORA: ${LIMITE_RECUPERAR_HORA:-10}        # pedidos de «¿Olvidaste tu clave?» (mandan correos) por IP y hora
      DEMO_PASSWORD: ${DEMO_PASSWORD:?define DEMO_PASSWORD en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VELOCIDAD_MEDIA_KMH: ${VELOCIDAD_MEDIA_KMH:-50}
      CONFIRMACION_AUTO_SEG: ${CONFIRMACION_AUTO_SEG:-120}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      FACTOR_CALLES: ${FACTOR_CALLES:-1.3}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD en .env}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-}
      MAP_TILE_SUBDOMAINS: ${MAP_TILE_SUBDOMAINS:-}
      ASISTENTE_ACTIVO: ${ASISTENTE_ACTIVO:-1}
      IA_CHAT_PROVEEDORES: ${IA_CHAT_PROVEEDORES:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-}
      IA_PROVEEDORES: ${IA_PROVEEDORES:-}
      EMAIL_HOST: ${EMAIL_HOST:-}                                # correo para recuperar la clave; vacío = se escribe en el registro del contenedor
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_REMITENTE: ${EMAIL_REMITENTE:-}
    ports: ["${WEB_PUERTO:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  # La flota de 50 camiones se reparte en 5 contenedores de 10 (CAM-01 a CAM-10, CAM-11 a CAM-20, ...)
  flota-1: &flota
    build: ./iot
    environment: &flota-env {<<: *bd, PRIMER_CAMION: "1", NUM_CAMIONES: "10", INTERVALO_SEG: "${INTERVALO_SEG:-5}", PROB_RUPTURA: "${PROB_RUPTURA:-0.001}", CONFIRMACION_AUTO_SEG: "${CONFIRMACION_AUTO_SEG:-120}", VELOCIDAD_MEDIA_KMH: "${VELOCIDAD_MEDIA_KMH:-50}", FACTOR_CALLES: "${FACTOR_CALLES:-1.3}"}
    depends_on: [web]
    restart: unless-stopped
  flota-2: {<<: *flota, environment: {<<: *flota-env, PRIMER_CAMION: "11"}}
  flota-3: {<<: *flota, environment: {<<: *flota-env, PRIMER_CAMION: "21"}}
  flota-4: {<<: *flota, environment: {<<: *flota-env, PRIMER_CAMION: "31"}}
  flota-5: {<<: *flota, environment: {<<: *flota-env, PRIMER_CAMION: "41"}}

  grafana:
    image: grafana/grafana:11.6.16
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-cofrial}
      DB_SSLMODE: disable                 # contra RDS se usa "require"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD en .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD en .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"          # no hay pantalla de login propia: entra solo quien Django deja pasar por /bi/
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"               # Grafana confía en X-WEBAUTH-USER: por eso su puerto NO se publica (solo la red de Docker)
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"   # administrador -> Admin (edita); gerencia -> Viewer (solo mira)
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/bi/"
      GF_LIVE_MAX_CONNECTIONS: "0"                # sin websockets: Django (WSGI) no los reenvía y el tablero se actualiza por consultas
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cofrial.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"       # evita el caché de avatares (DoS CVE-2026-21720)
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"       # sin tableros públicos por enlace (DoS CVE-2026-42127)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    expose: ["3000"]                          # solo dentro de la red de Docker; se abre desde la aplicación en /bi/ (cofrial/bi.py)
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [web]
    restart: unless-stopped


volumes:
  pgdata:
