{% extends "base.html" %}
{% block titulo %}Entrar | Cofrial SpA{% endblock %}
{% block contenido %}
<div class="login tarjeta-ui">
  <h1 style="font-size:1.4rem;margin-bottom:4px">Entrar</h1>
  <p class="muted">Accede a tu cuenta de cliente o al CRM.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button>Entrar</button>
  </form>
</div>
{% endblock %}
