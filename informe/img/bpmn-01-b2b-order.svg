<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #000; }
      .label { font-size: 11px; fill: #333; }
      .process { fill: #4caf50; stroke: #2e7d32; stroke-width: 2; }
      .decision { fill: #ff9800; stroke: #e65100; stroke-width: 2; }
      .problem { fill: #f44336; stroke: #c62828; stroke-width: 2; }
      .solution { fill: #2196f3; stroke: #0d47a1; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .lane-title { font-size: 12px; font-weight: bold; fill: #fff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <text x="700" y="25" text-anchor="middle" class="title">BPMN 1: Proceso B2B Order (AS-IS vs TO-BE)</text>

  <!-- AS-IS LANE -->
  <rect x="10" y="40" width="670" height="540" fill="#ffe0e0" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="20" y="60" class="lane-title" fill="#d32f2f">AS-IS (Problema: Toma manual de nota)</text>

  <!-- AS-IS Flow -->
  <circle cx="50" cy="150" r="20" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="50" y="230" text-anchor="middle" class="label">Vendedor B2B</text>

  <rect x="120" y="130" width="80" height="40" class="problem"/>
  <text x="160" y="155" text-anchor="middle" class="label">Recibe pedido</text>
  <text x="160" y="167" text-anchor="middle" class="label">por teléfono</text>

  <path class="arrow" d="M 200 150 L 280 150"/>

  <rect x="280" y="130" width="80" height="40" class="problem"/>
  <text x="320" y="155" text-anchor="middle" class="label">Toma nota</text>
  <text x="320" y="167" text-anchor="middle" class="label">manual</text>

  <path class="arrow" d="M 360 150 L 440 150"/>

  <polygon points="440,140 460,150 440,160" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="450" y="190" text-anchor="middle" class="label">¿Cliente válido?</text>

  <path class="arrow" d="M 460 140 L 500 100"/>
  <text x="470" y="120" class="label">SÍ</text>

  <rect x="500" y="80" width="80" height="40" class="problem"/>
  <text x="540" y="105" text-anchor="middle" class="label">Transcribe a</text>
  <text x="540" y="117" text-anchor="middle" class="label">Excel/email</text>

  <path class="arrow" d="M 540 160 L 560 180"/>
  <text x="540" y="170" class="label">NO</text>

  <circle cx="560" cy="200" r="20" fill="#ffb74d" stroke="#f57c00" stroke-width="2"/>
  <text x="560" y="240" text-anchor="middle" class="label">Pedido rechazado</text>

  <path class="arrow" d="M 580 150 L 640 150"/>

  <rect x="640" y="130" width="20" height="40" fill="#666"/>
  <text x="660" y="155" text-anchor="middle" class="label">FIN</text>

  <!-- Problema highlight -->
  <text x="50" y="300" class="label" font-weight="bold" fill="#c62828">Problemas:</text>
  <text x="50" y="320" class="label" fill="#c62828">• Tardanza 2-3 horas</text>
  <text x="50" y="340" class="label" fill="#c62828">• Errores de transcripción</text>
  <text x="50" y="360" class="label" fill="#c62828">• Sin confirmación instantánea</text>
  <text x="50" y="380" class="label" fill="#c62828">• No integrado a inventario</text>
  <text x="50" y="400" class="label" fill="#c62828">• Cliente sin visibilidad</text>

  <!-- TO-BE LANE -->
  <rect x="720" y="40" width="670" height="540" fill="#e0f2e0" stroke="#2e7d32" stroke-width="2"/>
  <text x="730" y="60" class="lane-title" fill="#fff" style="background-color:#2e7d32;">TO-BE (Solución: E-commerce B2B instantáneo)</text>

  <!-- TO-BE Flow -->
  <circle cx="760" cy="150" r="20" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="760" y="230" text-anchor="middle" class="label">Cliente B2B</text>

  <rect x="830" y="130" width="80" height="40" class="solution"/>
  <text x="870" y="155" text-anchor="middle" class="label">Ingresa al</text>
  <text x="870" y="167" text-anchor="middle" class="label">e-commerce</text>

  <path class="arrow" d="M 910 150 L 990 150"/>

  <rect x="990" y="130" width="80" height="40" class="solution"/>
  <text x="1030" y="155" text-anchor="middle" class="label">Selecciona</text>
  <text x="1030" y="167" text-anchor="middle" class="label">precios instit.</text>

  <path class="arrow" d="M 1070 150 L 1150 150"/>

  <rect x="1150" y="130" width="80" height="40" class="solution"/>
  <text x="1190" y="155" text-anchor="middle" class="label">Arma carrito</text>
  <text x="1190" y="167" text-anchor="middle" class="label">+ validación</text>

  <path class="arrow" d="M 1230 150 L 1310 150"/>

  <rect x="1310" y="130" width="20" height="40" fill="#4caf50"/>
  <text x="1340" y="155" text-anchor="middle" class="label">FIN: Orden</text>
  <text x="1340" y="167" text-anchor="middle" class="label">en BD</text>

  <!-- Solución highlight -->
  <text x="760" y="300" class="label" font-weight="bold" fill="#2e7d32">Solución:</text>
  <text x="760" y="320" class="label" fill="#2e7d32">• Instantáneo (segundos)</text>
  <text x="760" y="340" class="label" fill="#2e7d32">• Sin errores (validación automática)</text>
  <text x="760" y="360" class="label" fill="#2e7d32">• En DB al momento</text>
  <text x="760" y="380" class="label" fill="#2e7d32">• Cliente ve confirmación</text>
  <text x="760" y="400" class="label" fill="#2e7d32">• Integrado a CRM</text>
  <text x="760" y="420" class="label" fill="#2e7d32">• Inventario actualizado</text>

  <!-- Impacto -->
  <rect x="50" y="450" width="1320" height="110" fill="#fff9e6" stroke="#ff9800" stroke-width="2"/>
  <text x="70" y="475" class="label" font-weight="bold">Impacto financiero:</text>
  <text x="70" y="495" class="label">Actual: 15 órdenes manuales/día × 2h promedio = 30h/semana perdidas. Costo: $450k/año en horas.</text>
  <text x="70" y="515" class="label">Futuro: e-commerce reduce a 0.5h/semana. Ahorro: $432k/año. Plus: reduce errores (ahora 15% devoluciones → estimado 2%).</text>
  <text x="70" y="535" class="label">ROI esperado: 6 meses. Plus: satisfacción cliente (confirmación al instante).</text>
</svg>
