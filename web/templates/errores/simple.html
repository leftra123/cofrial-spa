<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ titulo }} | Cofrial SpA</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f4f7fa; color: #12263a; padding: 16px; box-sizing: border-box; }
  main { max-width: 460px; text-align: center; background: #fff; border: 1px solid #d6e0ea; border-radius: 14px; padding: 32px 24px; }
  .codigo { font-size: 56px; font-weight: 700; color: #2b6cb0; line-height: 1; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { margin: 0 0 20px; color: #4a5f73; }
  a { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #2b6cb0; color: #fff; text-decoration: none; }
  @media (prefers-color-scheme: dark) { body { background: #0e1620; color: #e6edf5; } main { background: #162230; border-color: #263a4f; } p { color: #9db2c7; } }
</style>
</head>
<body>
<main>
  <div class="codigo" aria-hidden="true">{{ codigo }}</div>
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  <a href="/">Volver al inicio</a>
</main>
</body>
</html>
