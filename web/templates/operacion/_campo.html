{% comment %}Un campo de formulario con su etiqueta, ayuda y errores. Recibe c (el BoundField).{% endcomment %}
<div class="campo-op">
  <label for="{{ c.id_for_label }}">{{ c.label }}</label>{{ c }}
  {% if c.help_text %}<p class="frio" id="{{ c.id_for_label }}-ayuda">{{ c.help_text }}</p>{% endif %}
  {% for e in c.errors %}<p class="error-campo" role="alert">{{ e }}</p>{% endfor %}
</div>
