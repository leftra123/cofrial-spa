<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #000; }
      .entity { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .pk { font-weight: bold; fill: #d32f2f; font-size: 11px; }
      .fk { font-style: italic; fill: #0097a7; font-size: 11px; }
      .attr { fill: #424242; font-size: 10px; }
      .relation { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .label-rel { font-size: 10px; fill: #555; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555" />
    </marker>
  </defs>

  <!-- Título -->
  <text x="700" y="30" text-anchor="middle" class="title">Diagrama ER - Modelo de Datos Cofrial SpA (3FN, 14 entidades)</text>

  <!-- CLIENTE (central) -->
  <rect x="30" y="100" width="140" height="100" class="entity"/>
  <text x="100" y="120" text-anchor="middle" class="pk">CLIENTE</text>
  <line x1="30" y1="130" x2="170" y2="130" stroke="#1976d2" stroke-width="1"/>
  <text x="35" y="145" class="pk">cliente_id PK</text>
  <text x="35" y="160" class="attr">nombre, rut, tipo</text>
  <text x="35" y="175" class="attr">email, credito_límite</text>
  <text x="35" y="190" class="attr">activo, creado_en</text>

  <!-- DIRECCION -->
  <rect x="250" y="100" width="140" height="90" class="entity"/>
  <text x="320" y="120" text-anchor="middle" class="pk">DIRECCION</text>
  <line x1="250" y1="130" x2="390" y2="130" stroke="#1976d2" stroke-width="1"/>
  <text x="255" y="145" class="pk">direccion_id PK</text>
  <text x="255" y="160" class="fk">cliente_id FK</text>
  <text x="255" y="175" class="attr">calle, ciudad, región</text>

  <!-- Relación CLIENTE - DIRECCION -->
  <path class="relation" d="M 170 140 L 250 140"/>
  <text x="205" y="135" class="label-rel">1:N</text>

  <!-- ORDEN -->
  <rect x="450" y="100" width="160" height="120" class="entity"/>
  <text x="530" y="120" text-anchor="middle" class="pk">ORDEN</text>
  <line x1="450" y1="130" x2="610" y2="130" stroke="#1976d2" stroke-width="1"/>
  <text x="455" y="145" class="pk">orden_id PK</text>
  <text x="455" y="160" class="fk">cliente_id FK</text>
  <text x="455" y="175" class="fk">camion_id FK NEW</text>
  <text x="455" y="190" class="fk">estado_orden_id FK</text>
  <text x="455" y="205" class="attr">fecha_creacion, tiempo_salida</text>

  <!-- Relación CLIENTE - ORDEN -->
  <path class="relation" d="M 170 140 L 450 140"/>
  <text x="305" y="135" class="label-rel">1:N</text>

  <!-- PRODUCTO -->
  <rect x="450" y="280" width="160" height="100" class="entity"/>
  <text x="530" y="300" text-anchor="middle" class="pk">PRODUCTO</text>
  <line x1="450" y1="310" x2="610" y2="310" stroke="#1976d2" stroke-width="1"/>
  <text x="455" y="325" class="pk">producto_id PK</text>
  <text x="455" y="340" class="fk">categoria_id FK</text>
  <text x="455" y="355" class="attr">nombre, temp_rango</text>
  <text x="455" y="370" class="attr">costo_unitario, activo</text>

  <!-- CATEGORIA -->
  <rect x="700" y="280" width="140" height="80" class="entity"/>
  <text x="770" y="300" text-anchor="middle" class="pk">CATEGORIA</text>
  <line x1="700" y1="310" x2="840" y2="310" stroke="#1976d2" stroke-width="1"/>
  <text x="705" y="325" class="pk">categoria_id PK</text>
  <text x="705" y="340" class="attr">nombre, descripción</text>

  <!-- Relación PRODUCTO - CATEGORIA -->
  <path class="relation" d="M 610 330 L 700 330"/>
  <text x="650" y="325" class="label-rel">N:1</text>

  <!-- LISTA_PRECIO -->
  <rect x="700" y="100" width="140" height="90" class="entity"/>
  <text x="770" y="120" text-anchor="middle" class="pk">LISTA_PRECIO</text>
  <line x1="700" y1="130" x2="840" y2="130" stroke="#1976d2" stroke-width="1"/>
  <text x="705" y="145" class="pk">lista_precio_id PK</text>
  <text x="705" y="160" class="attr">nombre, tipo (B2B/B2C)</text>
  <text x="705" y="175" class="attr">descripción</text>

  <!-- PRECIO_PRODUCTO -->
  <rect x="920" y="100" width="150" height="100" class="entity"/>
  <text x="995" y="120" text-anchor="middle" class="pk">PRECIO_PRODUCTO</text>
  <line x1="920" y1="130" x2="1070" y2="130" stroke="#1976d2" stroke-width="1"/>
  <text x="925" y="145" class="pk">lista_precio_id FK</text>
  <text x="925" y="160" class="pk">producto_id FK</text>
  <text x="925" y="175" class="attr">precio_unitario</text>
  <text x="925" y="190" class="attr">vigente_desde</text>

  <!-- Relaciones LISTA_PRECIO - PRECIO_PRODUCTO -->
  <path class="relation" d="M 840 140 L 920 140"/>
  <text x="875" y="135" class="label-rel">1:N</text>

  <!-- Relación PRODUCTO - PRECIO_PRODUCTO -->
  <path class="relation" d="M 610 330 L 995 200"/>
  <text x="790" y="265" class="label-rel">1:N</text>

  <!-- ORDEN_ITEM -->
  <rect x="700" y="450" width="160" height="120" class="entity"/>
  <text x="780" y="470" text-anchor="middle" class="pk">ORDEN_ITEM</text>
  <line x1="700" y1="480" x2="860" y2="480" stroke="#1976d2" stroke-width="1"/>
  <text x="705" y="495" class="pk">orden_id FK</text>
  <text x="705" y="510" class="pk">item_numero PK</text>
  <text x="705" y="525" class="fk">producto_id FK</text>
  <text x="705" y="540" class="attr">cantidad, precio_unitario</text>
  <text x="705" y="555" class="attr">subtotal</text>

  <!-- Relación ORDEN - ORDEN_ITEM -->
  <path class="relation" d="M 530 220 L 780 450"/>
  <text x="640" y="330" class="label-rel">1:N</text>

  <!-- Relación PRODUCTO - ORDEN_ITEM -->
  <path class="relation" d="M 530 380 L 740 450"/>
  <text x="620" y="415" class="label-rel">1:N</text>

  <!-- ESTADO_ORDEN -->
  <rect x="250" y="280" width="140" height="80" class="entity"/>
  <text x="320" y="300" text-anchor="middle" class="pk">ESTADO_ORDEN</text>
  <line x1="250" y1="310" x2="390" y2="310" stroke="#1976d2" stroke-width="1"/>
  <text x="255" y="325" class="pk">estado_orden_id PK</text>
  <text x="255" y="340" class="attr">nombre, secuencia</text>

  <!-- Relación ORDEN - ESTADO_ORDEN -->
  <path class="relation" d="M 450 150 L 390 280"/>
  <text x="415" y="215" class="label-rel">N:1</text>

  <!-- CAMION -->
  <rect x="1150" y="280" width="140" height="100" class="entity"/>
  <text x="1220" y="300" text-anchor="middle" class="pk">CAMION</text>
  <line x1="1150" y1="310" x2="1290" y2="310" stroke="#1976d2" stroke-width="1"/>
  <text x="1155" y="325" class="pk">camion_id PK</text>
  <text x="1155" y="340" class="attr">modelo, capacidad</text>
  <text x="1155" y="355" class="attr">temp_rango_min/max</text>
  <text x="1155" y="370" class="attr">activo</text>

  <!-- Relación ORDEN - CAMION -->
  <path class="relation" d="M 610 160 L 1150 320"/>
  <text x="870" y="240" class="label-rel">N:1</text>

  <!-- TELEMETRIA -->
  <rect x="1150" y="450" width="160" height="120" class="entity"/>
  <text x="1230" y="470" text-anchor="middle" class="pk">TELEMETRIA</text>
  <line x1="1150" y1="480" x2="1310" y2="480" stroke="#1976d2" stroke-width="1"/>
  <text x="1155" y="495" class="pk">camion_id FK</text>
  <text x="1155" y="510" class="pk">timestamp PK</text>
  <text x="1155" y="525" class="attr">temp_camara, lat, long</text>
  <text x="1155" y="540" class="attr">combustible_pct</text>
  <text x="1155" y="555" class="attr">alerta_ruptura_frio</text>

  <!-- Relación CAMION - TELEMETRIA -->
  <path class="relation" d="M 1220 380 L 1230 450"/>
  <text x="1235" y="415" class="label-rel">1:N</text>

  <!-- VENDEDOR -->
  <rect x="30" y="450" width="140" height="80" class="entity"/>
  <text x="100" y="470" text-anchor="middle" class="pk">VENDEDOR</text>
  <line x1="30" y1="480" x2="170" y2="480" stroke="#1976d2" stroke-width="1"/>
  <text x="35" y="495" class="pk">vendedor_id PK</text>
  <text x="35" y="510" class="attr">nombre, email, activo</text>

  <!-- OPORTUNIDAD -->
  <rect x="250" y="450" width="160" height="120" class="entity"/>
  <text x="330" y="470" text-anchor="middle" class="pk">OPORTUNIDAD</text>
  <line x1="250" y1="480" x2="410" y2="480" stroke="#1976d2" stroke-width="1"/>
  <text x="255" y="495" class="fk">cliente_id FK</text>
  <text x="255" y="510" class="fk">vendedor_id FK</text>
  <text x="255" y="525" class="fk">etapa_pipeline_id FK</text>
  <text x="255" y="540" class="attr">monto_estimado, fechas</text>

  <!-- ETAPA_PIPELINE -->
  <rect x="30" y="650" width="140" height="90" class="entity"/>
  <text x="100" y="670" text-anchor="middle" class="pk">ETAPA_PIPELINE</text>
  <line x1="30" y1="680" x2="170" y2="680" stroke="#1976d2" stroke-width="1"/>
  <text x="35" y="695" class="pk">etapa_pipeline_id PK</text>
  <text x="35" y="710" class="attr">nombre, secuencia</text>

  <!-- INTERACCION -->
  <rect x="250" y="650" width="160" height="100" class="entity"/>
  <text x="330" y="670" text-anchor="middle" class="pk">INTERACCION</text>
  <line x1="250" y1="680" x2="410" y2="680" stroke="#1976d2" stroke-width="1"/>
  <text x="255" y="695" class="pk">interaccion_id PK</text>
  <text x="255" y="710" class="fk">oportunidad_id FK</text>
  <text x="255" y="725" class="fk">vendedor_id FK</text>
  <text x="255" y="740" class="attr">tipo, fecha, notas</text>

  <!-- Relaciones Vendedor -->
  <path class="relation" d="M 170 490 L 250 520"/>
  <text x="200" y="510" class="label-rel">1:N</text>

  <path class="relation" d="M 100 530 L 330 450"/>
  <text x="185" y="490" class="label-rel">1:N</text>

  <!-- Relaciones OPORTUNIDAD -->
  <path class="relation" d="M 330 570 L 100 650"/>
  <text x="210" y="610" class="label-rel">N:1</text>

  <path class="relation" d="M 330 570 L 330 650"/>
  <text x="340" y="610" class="label-rel">N:1</text>

  <!-- Relaciones INTERACCION -->
  <path class="relation" d="M 330 750 L 330 570"/>
  <text x="345" y="660" class="label-rel">N:1</text>

  <path class="relation" d="M 250 700 L 170 700"/>
  <text x="205" y="695" class="label-rel">N:1</text>

  <!-- Leyenda -->
  <rect x="30" y="820" width="1290" height="150" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="50" y="845" class="title">Leyenda y Notas</text>
  <text x="50" y="870" class="attr">PK = Primary Key (clave primaria) · FK = Foreign Key (clave foránea) · 1:N = Relación uno a muchos · N:1 = Relación muchos a uno</text>
  <text x="50" y="890" class="attr">• Normalización: Todas las entidades están en 3FN (sin dependencias transitivas)</text>
  <text x="50" y="910" class="attr">• ORDEN ahora ligada a CAMION: permite seguimiento en vivo de temperatura por pedido</text>
  <text x="50" y="930" class="attr">• TELEMETRIA: 6 campos exigidos por pauta (camion_id, temp_camara, lat, long, combustible_pct, alerta_ruptura_frio)</text>
  <text x="50" y="950" class="attr">• Total: 14 entidades · 2 claves compuestas (PRECIO_PRODUCTO, ORDEN_ITEM, TELEMETRIA) · Relaciones explícitas para integridad referencial</text>
</svg>
