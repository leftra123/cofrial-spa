# Entorno local completo (base, web y camiones) para desarrollar y probar antes de subir a AWS.
# En AWS se separa: web en una EC2, simulador en otra y la base en RDS (ver docs/decisiones.md).
x-bd: &bd
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-cofrial}
  DB_USER: ${DB_USER:-cofrial}
  DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cofrial}
      POSTGRES_USER: ${DB_USER:-cofrial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    ports: ["5433:5432"]            # 5433 para no chocar con un Postgres local
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cofrial} -d ${DB_NAME:-cofrial}"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    command: sh -c "python manage.py migrate --noinput && python manage.py cargar_demo && python manage.py cambiar_clave_demo --si-hay-clave $${DEMO_CLAVE_DEBIL:+--permitir-clave-debil} && python manage.py preparar_bi && gunicorn cofrial.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      <<: *bd
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-clave-solo-para-desarrollo}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-cofrial-2026}
      DEMO_CLAVE_DEBIL: ${DEMO_CLAVE_DEBIL:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD en .env}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-}
      MAP_TILE_SUBDOMAINS: ${MAP_TILE_SUBDOMAINS:-}
      ASISTENTE_ACTIVO: ${ASISTENTE_ACTIVO:-1}
      IA_CHAT_PROVEEDORES: ${IA_CHAT_PROVEEDORES:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-}
      IA_PROVEEDORES: ${IA_PROVEEDORES:-}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  camion-01: &camion
    build: ./iot
    environment: {<<: *bd, CAMION_ID: CAM-01, INTERVALO_SEG: "${INTERVALO_SEG:-5}", PROB_RUPTURA: "${PROB_RUPTURA:-0.01}", VELOCIDAD_MEDIA_KMH: "${VELOCIDAD_MEDIA_KMH:-50}", FACTOR_CALLES: "${FACTOR_CALLES:-1.3}"}
    depends_on: [web]
    restart: unless-stopped
  camion-02:
    <<: *camion
    environment: {<<: *bd, CAMION_ID: CAM-02, INTERVALO_SEG: "${INTERVALO_SEG:-5}", PROB_RUPTURA: "${PROB_RUPTURA:-0.01}", VELOCIDAD_MEDIA_KMH: "${VELOCIDAD_MEDIA_KMH:-50}", FACTOR_CALLES: "${FACTOR_CALLES:-1.3}"}
  camion-03:
    <<: *camion
    environment: {<<: *bd, CAMION_ID: CAM-03, INTERVALO_SEG: "${INTERVALO_SEG:-5}", PROB_RUPTURA: "${PROB_RUPTURA:-0.01}", VELOCIDAD_MEDIA_KMH: "${VELOCIDAD_MEDIA_KMH:-50}", FACTOR_CALLES: "${FACTOR_CALLES:-1.3}"}

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-cofrial}
      DB_SSLMODE: disable                 # contra RDS se usa "require"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD en .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD en .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # el tablero se puede mirar sin clave; editar exige la cuenta admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cofrial.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
