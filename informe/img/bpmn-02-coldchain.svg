<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #000; }
      .label { font-size: 11px; fill: #333; }
      .process { fill: #4caf50; stroke: #2e7d32; stroke-width: 2; }
      .decision { fill: #ff9800; stroke: #e65100; stroke-width: 2; }
      .problem { fill: #f44336; stroke: #c62828; stroke-width: 2; }
      .solution { fill: #2196f3; stroke: #0d47a1; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .lane-title { font-size: 12px; font-weight: bold; fill: #fff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <text x="700" y="25" text-anchor="middle" class="title">BPMN 2: Cold-Chain Dispatch (AS-IS vs TO-BE)</text>

  <!-- AS-IS LANE -->
  <rect x="10" y="40" width="670" height="540" fill="#ffe0e0" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="20" y="60" class="lane-title" fill="#d32f2f">AS-IS (Problema: Sin monitoreo en ruta)</text>

  <circle cx="50" cy="150" r="20" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="50" y="230" text-anchor="middle" class="label">Despachador</text>

  <rect x="120" y="130" width="80" height="40" class="problem"/>
  <text x="160" y="155" text-anchor="middle" class="label">Orden lista</text>
  <text x="160" y="167" text-anchor="middle" class="label">para envío</text>

  <path class="arrow" d="M 200 150 L 280 150"/>

  <rect x="280" y="130" width="80" height="40" class="problem"/>
  <text x="320" y="155" text-anchor="middle" class="label">Camión sale</text>
  <text x="320" y="167" text-anchor="middle" class="label">(SIN GPS)</text>

  <path class="arrow" d="M 360 150 L 440 150"/>

  <rect x="440" y="130" width="80" height="40" class="problem"/>
  <text x="480" y="155" text-anchor="middle" class="label">Ruta ciega</text>
  <text x="480" y="167" text-anchor="middle" class="label">4-6 horas</text>

  <path class="arrow" d="M 520 150 L 600 150"/>

  <rect x="600" y="130" width="20" height="40" fill="#666"/>
  <text x="620" y="155" text-anchor="middle" class="label">Llega</text>

  <text x="50" y="300" class="label" font-weight="bold" fill="#c62828">Problemas:</text>
  <text x="50" y="320" class="label" fill="#c62828">• Ruptura de frío no detectada</text>
  <text x="50" y="340" class="label" fill="#c62828">• Producto dañado sin aviso</text>
  <text x="50" y="360" class="label" fill="#c62828">• Cliente reclama en entrega</text>
  <text x="50" y="380" class="label" fill="#c62828">• Hasta 5% pérdida por daño</text>
  <text x="50" y="400" class="label" fill="#c62828">• Sin trazabilidad de ruta</text>

  <!-- TO-BE LANE -->
  <rect x="720" y="40" width="670" height="540" fill="#e0f2e0" stroke="#2e7d32" stroke-width="2"/>
  <text x="730" y="60" class="lane-title" fill="#fff" style="background-color:#2e7d32;">TO-BE (Solución: IoT + Alertas en vivo)</text>

  <circle cx="760" cy="150" r="20" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="760" y="230" text-anchor="middle" class="label">Despachador</text>

  <rect x="830" y="130" width="80" height="40" class="solution"/>
  <text x="870" y="155" text-anchor="middle" class="label">Orden lista</text>
  <text x="870" y="167" text-anchor="middle" class="label">+ asigna camión</text>

  <path class="arrow" d="M 910 150 L 990 150"/>

  <rect x="990" y="130" width="80" height="40" class="solution"/>
  <text x="1030" y="155" text-anchor="middle" class="label">Camión sale</text>
  <text x="1030" y="167" text-anchor="middle" class="label">+GPS+IoT</text>

  <path class="arrow" d="M 1070 150 L 1150 150"/>

  <polygon points="1150,140 1170,150 1150,160" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="1160" y="190" text-anchor="middle" class="label">¿Temp ok?</text>

  <path class="arrow" d="M 1170 140 L 1280 100"/>
  <text x="1210" y="120" class="label">SÍ</text>

  <rect x="1280" y="80" width="80" height="40" class="solution"/>
  <text x="1320" y="105" text-anchor="middle" class="label">Monitoreo</text>
  <text x="1320" y="117" text-anchor="middle" class="label">en Dashboard</text>

  <path class="arrow" d="M 1170 160 L 1220 200"/>
  <text x="1185" y="180" class="label">NO</text>

  <rect x="1220" y="200" width="80" height="40" class="problem"/>
  <text x="1260" y="225" text-anchor="middle" class="label">ALERTA</text>
  <text x="1260" y="237" text-anchor="middle" class="label">inmediata</text>

  <path class="arrow" d="M 1260 240 L 1240 280"/>

  <rect x="1190" y="280" width="100" height="40" class="solution"/>
  <text x="1240" y="305" text-anchor="middle" class="label">Contacta cliente</text>

  <text x="760" y="300" class="label" font-weight="bold" fill="#2e7d32">Solución:</text>
  <text x="760" y="320" class="label" fill="#2e7d32">• Telemetría cada 30 segundos</text>
  <text x="760" y="340" class="label" fill="#2e7d32">• Alerta inmediata si T > 4.5°C</text>
  <text x="760" y="360" class="label" fill="#2e7d32">• GPS en vivo (Leaflet map)</text>
  <text x="760" y="380" class="label" fill="#2e7d32">• Trazabilidad completa</text>
  <text x="760" y="400" class="label" fill="#2e7d32">• Cliente notificado antes de daño</text>

  <!-- Impacto -->
  <rect x="50" y="450" width="1320" height="110" fill="#fff9e6" stroke="#ff9800" stroke-width="2"/>
  <text x="70" y="475" class="label" font-weight="bold">Impacto financiero:</text>
  <text x="70" y="495" class="label">Actual: 50 camiones × 5% merma diaria = 2.5 camiones con daño/día. Costo: $12M/año (productos dañados).</text>
  <text x="70" y="515" class="label">Futuro: alertas reducen daño a 1%. Ahorro: $10.4M/año. Plus: trazabilidad reduce reclamaciones en 80%.</text>
  <text x="70" y="535" class="label">ROI esperado: 1 mes. Plus: confianza de clientes (cadena de frío garantizada).</text>
</svg>
