{% comment %}Ilustración simple por categoría (sin fotos). Parámetro: categoria (nombre).{% endcomment %}
<svg class="ilus" viewBox="0 0 120 90" role="img" aria-label="{{ categoria }}">

{% else %}

{% endif %}
</svg>
