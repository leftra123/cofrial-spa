apiVersion: 1
datasources:
  - name: Cofrial
    uid: cofrial-pg
    type: postgres
    access: proxy
    url: ${DB_HOST}:${DB_PORT}
    user: grafana_ro
    database: ${DB_NAME}
    isDefault: true
    jsonData:
      database: ${DB_NAME}
      sslmode: ${DB_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
