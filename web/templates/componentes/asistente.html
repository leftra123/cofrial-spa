{% load static %}{% if asistente_activo %}
<div class="asistente" id="asistente" data-url="/api/asistente/" data-producto="{{ producto_id|default:'' }}" data-orden="{{ orden_id|default:'' }}" data-pagina="{{ pagina|default:'' }}">
  {% csrf_token %}
  <button type="button" class="asistente-btn" id="asistente-btn" aria-label="Abrir a Cofri, el asistente de Cofrial" aria-expanded="false" aria-controls="asistente-panel">
    <img class="asistente-cara" src="{% static 'img/marca/avatar-cara.webp' %}" alt="" width="40" height="40"><span>Cofri</span>
  </button>
  <section class="asistente-panel" id="asistente-panel" role="dialog" aria-labelledby="asistente-t" hidden>
    <header class="asistente-cab">
      <img class="asistente-camion" src="{% static 'img/marca/avatar-camion.webp' %}" alt="" width="72" height="48">
      <div><h2 id="asistente-t">Cofri · agente de Cofrial (IA)</h2>
        <p class="asistente-aviso">Responde con inteligencia artificial a partir de los datos de la tienda. Puede equivocarse: lo importante, confírmalo en Soporte.</p></div>
      <button type="button" class="asistente-cerrar" id="asistente-cerrar" aria-label="Cerrar el asistente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="asistente-log" id="asistente-log" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="asistente-sug" id="asistente-sug"></div>
    <form class="asistente-form" id="asistente-form" autocomplete="off">
      <label class="solo-lector" for="asistente-in">Tu pregunta al asistente</label>
      <input id="asistente-in" type="text" maxlength="300" placeholder="Pregunta por un precio, el stock o un pedido">
      <button type="submit" id="asistente-enviar">Enviar</button>
    </form>
    <p class="asistente-pie">¿Necesitas otra cosa? <a href="/soporte/">Escribe a Soporte</a>.</p>
  </section>
</div>
<script src="{% static 'js/asistente.js' %}" defer></script>
{% endif %}
