<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #000; }
      .label { font-size: 11px; fill: #333; }
      .process { fill: #4caf50; stroke: #2e7d32; stroke-width: 2; }
      .decision { fill: #ff9800; stroke: #e65100; stroke-width: 2; }
      .problem { fill: #f44336; stroke: #c62828; stroke-width: 2; }
      .solution { fill: #2196f3; stroke: #0d47a1; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .lane-title { font-size: 12px; font-weight: bold; fill: #fff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <text x="700" y="25" text-anchor="middle" class="title">BPMN 3: Prospect Management (AS-IS vs TO-BE)</text>

  <!-- AS-IS LANE -->
  <rect x="10" y="40" width="670" height="540" fill="#ffe0e0" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="20" y="60" class="lane-title" fill="#d32f2f">AS-IS (Shadow IT: Cartera en WhatsApp/Excel)</text>

  <circle cx="50" cy="150" r="20" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="50" y="230" text-anchor="middle" class="label">Vendedor</text>

  <rect x="120" y="130" width="80" height="40" class="problem"/>
  <text x="160" y="155" text-anchor="middle" class="label">Prospectos</text>
  <text x="160" y="167" text-anchor="middle" class="label">en celular</text>

  <path class="arrow" d="M 200 150 L 280 150"/>

  <rect x="280" y="130" width="80" height="40" class="problem"/>
  <text x="320" y="155" text-anchor="middle" class="label">Seguimiento</text>
  <text x="320" y="167" text-anchor="middle" class="label">por WhatsApp</text>

  <path class="arrow" d="M 360 150 L 440 150"/>

  <rect x="440" y="130" width="80" height="40" class="problem"/>
  <text x="480" y="155" text-anchor="middle" class="label">Historial</text>
  <text x="480" y="167" text-anchor="middle" class="label">en Excel</text>

  <path class="arrow" d="M 520 150 L 600 150"/>

  <rect x="600" y="130" width="20" height="40" fill="#666"/>
  <text x="620" y="155" text-anchor="middle" class="label">Venta</text>

  <text x="50" y="300" class="label" font-weight="bold" fill="#c62828">Problemas (Shadow IT):</text>
  <text x="50" y="320" class="label" fill="#c62828">• Ventas perdidas si vendedor se va</text>
  <text x="50" y="340" class="label" fill="#c62828">• Gerencia sin visibilidad de pipeline</text>
  <text x="50" y="360" class="label" fill="#c62828">• Duplicidad: mismo cliente en varios excel</text>
  <text x="50" y="380" class="label" fill="#c62828">• Seguimiento inconsistente</text>
  <text x="50" y="400" class="label" fill="#c62828">• 35% oportunidades pierden contacto</text>

  <!-- TO-BE LANE -->
  <rect x="720" y="40" width="670" height="540" fill="#e0f2e0" stroke="#2e7d32" stroke-width="2"/>
  <text x="730" y="60" class="lane-title" fill="#fff" style="background-color:#2e7d32;">TO-BE (Solución: CRM centralizado + IA)</text>

  <circle cx="760" cy="150" r="20" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="760" y="230" text-anchor="middle" class="label">Vendedor</text>

  <rect x="830" y="130" width="80" height="40" class="solution"/>
  <text x="870" y="155" text-anchor="middle" class="label">Carga</text>
  <text x="870" y="167" text-anchor="middle" class="label">prospecto</text>

  <path class="arrow" d="M 910 150 L 990 150"/>

  <rect x="990" y="130" width="80" height="40" class="solution"/>
  <text x="1030" y="155" text-anchor="middle" class="label">CRM tablero</text>
  <text x="1030" y="167" text-anchor="middle" class="label">visual</text>

  <path class="arrow" d="M 1070 150 L 1150 150"/>

  <polygon points="1150,140 1170,150 1150,160" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="1160" y="190" text-anchor="middle" class="label">Interacción?</text>

  <path class="arrow" d="M 1170 140 L 1280 100"/>
  <text x="1210" y="120" class="label">SÍ</text>

  <rect x="1280" y="80" width="80" height="40" class="solution"/>
  <text x="1320" y="105" text-anchor="middle" class="label">IA clasifica</text>
  <text x="1320" y="117" text-anchor="middle" class="label">(tipo requem.)</text>

  <path class="arrow" d="M 1170 160 L 1220 200"/>
  <text x="1185" y="180" class="label">NO</text>

  <rect x="1220" y="200" width="80" height="40" class="solution"/>
  <text x="1260" y="225" text-anchor="middle" class="label">Avanza etapa</text>
  <text x="1260" y="237" text-anchor="middle" class="label">pipeline</text>

  <path class="arrow" d="M 1260 240 L 1240 280"/>

  <rect x="1190" y="280" width="100" height="40" class="solution"/>
  <text x="1240" y="305" text-anchor="middle" class="label">Gerencia ve</text>
  <text x="1240" y="317" text-anchor="middle" class="label">dashboard</text>

  <text x="760" y="300" class="label" font-weight="bold" fill="#2e7d32">Solución:</text>
  <text x="760" y="320" class="label" fill="#2e7d32">• CRM centralizado: una fuente de verdad</text>
  <text x="760" y="340" class="label" fill="#2e7d32">• Tablero visual del pipeline</text>
  <text x="760" y="360" class="label" fill="#2e7d32">• Historial de interacciones</text>
  <text x="760" y="380" class="label" fill="#2e7d32">• IA clasifica requerimientos</text>
  <text x="760" y="400" class="label" fill="#2e7d32">• Gerencia con visibilidad en vivo</text>

  <!-- Impacto -->
  <rect x="50" y="450" width="1320" height="110" fill="#fff9e6" stroke="#ff9800" stroke-width="2"/>
  <text x="70" y="475" class="label" font-weight="bold">Impacto financiero:</text>
  <text x="70" y="495" class="label">Actual: 35% de oportunidades se pierden (Shadow IT, falta de seguimiento). Costo: ~$2M/año en ventas perdidas.</text>
  <text x="70" y="515" class="label">Futuro: CRM reduce pérdidas a 10%. Ganancia: $1.8M/año. Plus: tasa de conversión mejora 20% (IA + follow-up automático).</text>
  <text x="70" y="535" class="label">ROI esperado: 3 meses. Plus: datos para gerencia (predicción de cierre, análisis de vendedores).</text>
</svg>
