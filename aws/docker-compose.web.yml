# EC2 WEB (subred pública): aplicación Django + Grafana. La base está en RDS (subred privada), no aquí.
# Alta disponibilidad: hay DOS EC2 web (una por zona) detrás de un Application Load Balancer, con este mismo compose. ROL_WEB decide qué hace cada una:
#   primario (por defecto)  migra la base, carga datos de demostración, crea el usuario de Grafana y corre podador y despachador
#   secundario              espera a que la base esté migrada y solo sirve la aplicación (podador y despachador quedan dormidos)
# Así dos instancias nunca migran ni despachan a la vez. Un solo servidor (sin ALB) funciona igual: es primario.
# Uso desde la raíz del repositorio:  docker compose -f aws/docker-compose.web.yml --env-file .env up -d --build
# Límites por contenedor (la EC2 web es una t3.small: 2 vCPU y 2 GB). Son topes, no reservas: si un proceso se desboca, Docker lo reinicia a él
# (restart: unless-stopped) en vez de dejar a la instancia sin memoria y al balanceador sin destino. Los registros rotan para no llenar el disco.
x-registro: &registro
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-bd: &bd
  DB_HOST: ${DB_HOST:?define DB_HOST (endpoint de RDS) en .env}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-cofrial}
  DB_USER: ${DB_USER:-cofrial}
  DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
  DB_SSLMODE: ${DB_SSLMODE:-require}

services:
  web:
    build: ../web
    # migrate es idempotente; los datos de demostración se cargan solo la primera vez para no deshacer lo editado en /operacion/; preparar_bi crea el usuario de solo lectura de Grafana en RDS
    command: >
      sh -c 'if [ "$$ROL_WEB" = "secundario" ]; then
      until python manage.py migrate --check >/dev/null 2>&1; do echo "web secundaria: esperando las migraciones de la primaria"; sleep 10; done;
      else python manage.py migrate --noinput && python manage.py cargar_demo --solo-primera-vez && python manage.py preparar_bi; fi
      && exec gunicorn cofrial.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 16 --timeout 60 --access-logfile - --error-logfile -'
    environment:
      <<: *bd
      ROL_WEB: ${ROL_WEB:-primario}                              # primario | secundario (ver arriba)
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?define DJANGO_SECRET_KEY en .env}
      RETENCION_TELEMETRIA_DIAS: ${RETENCION_TELEMETRIA_DIAS:-7}   # la usa Podar telemetría en /operacion/sistema/: debe ser la misma del podador
      FORZAR_CARGA_DEMO: ${FORZAR_CARGA_DEMO:-0}                 # 1 = cargar datos de demostración nuevos en este arranque; usarlo antes de editar datos en /operacion/
      DJANGO_DEBUG: "0"
      VELOCIDAD_MEDIA_KMH: ${VELOCIDAD_MEDIA_KMH:-50}
      CONFIRMACION_AUTO_SEG: ${CONFIRMACION_AUTO_SEG:-120}
      DESPACHO_AUTO: ${DESPACHO_AUTO:-0}                         # 1 = el servicio despachador saca los viajes solo; la web lo necesita para mostrarlo en el panel
      DESPACHO_AUTO_ESPERA_MIN: ${DESPACHO_AUTO_ESPERA_MIN:-5}
      DESPACHO_AUTO_INTERVALO_SEG: ${DESPACHO_AUTO_INTERVALO_SEG:-60}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      FACTOR_CALLES: ${FACTOR_CALLES:-1.3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}                  # opcional y de pago: Claude como tercer proveedor de IA
      CLAUDE_MODELS: ${CLAUDE_MODELS:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}   # pago B2C en modo prueba; vacío = cobro simulado
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_PAYER_EMAIL: ${MERCADOPAGO_PAYER_EMAIL:-}     # comprador de prueba; lo exigen las cuentas @correo.test
      MP_EMULADOR: ${MP_EMULADOR:-1}                              # forzar = emulador de pago aunque haya claves (ver docs/mercadopago-checkout.md)
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_ORIGINS: ${DJANGO_CSRF_ORIGINS:-}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}            # ruta propia del panel de administración; por defecto /admin/
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}                         # 1 solo cuando hay certificado (cookies seguras y HSTS)
      DJANGO_HSTS_SEG: ${DJANGO_HSTS_SEG:-}                    # segundos de HSTS con DJANGO_HTTPS=1; vacío = un año
      DJANGO_CSP: ${DJANGO_CSP:-1}                             # política de contenido: 1 se aplica · informe solo avisa en el navegador · 0 sin cabecera
      DJANGO_HTTPS_REDIRECT: ${DJANGO_HTTPS_REDIRECT:-1}       # 0 detrás del ALB: él redirige 80->443 y sus chequeos de salud llegan por HTTP plano
      DJANGO_CONFIAR_PROXY: ${DJANGO_CONFIAR_PROXY:-0}         # 1 solo detrás de un balanceador que agrega X-Forwarded-For
      ACCESO_MAX_FALLOS_CUENTA: ${ACCESO_MAX_FALLOS_CUENTA:-10}   # claves malas por cuenta antes de bloquearla 15 min
      ACCESO_MAX_FALLOS_IP: ${ACCESO_MAX_FALLOS_IP:-0}           # 0 = sin límite por IP (en la defensa toda la sala sale por una IP)
      ESCANEO_MAX_404: ${ESCANEO_MAX_404:-60}                    # «no encontrado» por IP en la ventana antes del 429
      ESCANEO_VENTANA_SEG: ${ESCANEO_VENTANA_SEG:-600}
      LIMITE_REGISTRO_HORA: ${LIMITE_REGISTRO_HORA:-10}          # registros por IP y hora
      LIMITE_SOPORTE_HORA: ${LIMITE_SOPORTE_HORA:-20}            # consultas a soporte (gastan cuota de IA) por IP y hora
      LIMITE_RECUPERAR_HORA: ${LIMITE_RECUPERAR_HORA:-10}        # pedidos de «¿Olvidaste tu clave?» (mandan correos) por IP y hora
      INSTANCIA_EC2: ${INSTANCIA_EC2:-}                        # ID de la EC2 (lo escribe provision.sh con IMDSv2); la Torre de control lo muestra en la fila D1
      DEMO_PASSWORD: ${DEMO_PASSWORD:?define DEMO_PASSWORD en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD en .env}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      MAP_MAX_ZOOM: ${MAP_MAX_ZOOM:-}
      ASISTENTE_ACTIVO: ${ASISTENTE_ACTIVO:-1}
      IA_CHAT_PROVEEDORES: ${IA_CHAT_PROVEEDORES:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-}
      IA_PROVEEDORES: ${IA_PROVEEDORES:-}
      EMAIL_HOST: ${EMAIL_HOST:-}                                # correo para recuperar la clave; vacío = se escribe en el registro del contenedor
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_REMITENTE: ${EMAIL_REMITENTE:-}
    ports: ["80:8000"]
    restart: unless-stopped
    mem_limit: 1100m
    cpus: 1.5
    logging: *registro                        # los registros (incluidos los tracebacks) se leen con `docker logs`; con rotación para no llenar el disco

  # Borra cada día la telemetría normal antigua (docs/decisiones.md). Espera 10 min para no competir con el arranque.
  podador:
    build: ../web
    command: sh -c 'if [ "$$ROL_WEB" = "secundario" ]; then echo "Podador solo en la web primaria"; exec sleep infinity; fi; sleep 600; while true; do python manage.py podar_telemetria; sleep 86400; done'
    init: true
    environment:
      <<: *bd
      ROL_WEB: ${ROL_WEB:-primario}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: "0"
      RETENCION_TELEMETRIA_DIAS: ${RETENCION_TELEMETRIA_DIAS:-7}
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *registro

  # Vigilante de salud: cada minuto revisa web, base, IoT, Grafana, IA y pagos y guarda el resultado (alimenta /salud/). Solo en la web primaria
  # (una sola escritora). Si el laboratorio se apaga no hay quien revise: esas horas quedan como «sin registros» y no como caída.
  # Los chequeos de IA y pagos solo listan la cuenta: no gastan cuota ni cobran. SALUD_URL_PUBLICA (p. ej. https://www.cofrialspa.shop) agrega la revisión del balanceador.
  vigilante:
    build: ../web
    command: sh -c 'if [ "$$ROL_WEB" = "secundario" ]; then echo "Vigilante solo en la web primaria"; exec sleep infinity; fi; sleep 45; exec python manage.py vigilar --bucle'
    init: true
    environment:
      <<: *bd
      ROL_WEB: ${ROL_WEB:-primario}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: "0"
      SALUD_URL_WEB: http://web:8000/salud/
      SALUD_URL_PUBLICA: ${SALUD_URL_PUBLICA:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *registro

  # Despacho sin personas (flota/autodespacho.py). Apagado por defecto: queda dormido y no gasta nada hasta que DESPACHO_AUTO=1.
  # Servicio propio y no un paso del arranque: debe correr aunque nadie abra el panel, y gunicorn no lo espera (docs/decisiones.md).
  despachador:
    build: ../web
    command: sh -c 'if [ "$$ROL_WEB" = "secundario" ]; then echo "Despachador solo en la web primaria"; exec sleep infinity; fi; if [ "$$DESPACHO_AUTO" != "1" ]; then echo "Despacho automático apagado"; exec sleep infinity; fi; sleep 90; exec python manage.py despachar_auto --bucle'
    init: true
    environment:
      <<: *bd
      ROL_WEB: ${ROL_WEB:-primario}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: "0"
      DESPACHO_AUTO: ${DESPACHO_AUTO:-0}
      DESPACHO_AUTO_ESPERA_MIN: ${DESPACHO_AUTO_ESPERA_MIN:-5}
      DESPACHO_AUTO_INTERVALO_SEG: ${DESPACHO_AUTO_INTERVALO_SEG:-60}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-}
      IA_PROVEEDORES: ${IA_PROVEEDORES:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODELS: ${CLAUDE_MODELS:-}
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    logging: *registro

  grafana:
    image: grafana/grafana:11.6.16
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-cofrial}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD en .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD en .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"          # no hay pantalla de login propia: entra solo quien Django deja pasar por /bi/
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"               # Grafana confía en X-WEBAUTH-USER: por eso su puerto NO se publica (solo la red de Docker)
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"   # administrador -> Admin (edita); gerencia -> Viewer (solo mira)
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/bi/"
      GF_LIVE_MAX_CONNECTIONS: "0"                # sin websockets: Django (WSGI) no los reenvía y el tablero se actualiza por consultas
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cofrial.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"       # evita el caché de avatares (DoS CVE-2026-21720)
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"       # sin tableros públicos por enlace (DoS CVE-2026-42127)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    expose: ["3000"]                          # solo dentro de la red de Docker; se abre desde la aplicación en /bi/ (cofrial/bi.py)
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *registro                        # la imagen oficial ya corre como el usuario grafana (472), no como root

